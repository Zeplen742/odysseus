name: zeplen / docker image

# Build this fork's patched image (branch "zeplen") and publish it to GHCR.
#   :zeplen                     rolling, latest build of the branch
#   :<APP_VERSION>-zeplen.<sha> immutable pin (use this one in deployments)
# amd64 only. The image name is lowercase because GHCR rejects uppercase owners.

on:
  push:
    branches: [zeplen]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: zeplen-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zeplen742/odysseus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read APP_VERSION + short sha
        id: ver
        run: |
          v=$(grep -E '^APP_VERSION' src/constants.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$v" ] || { echo "APP_VERSION not found"; exit 1; }
          echo "pin=${v}-zeplen.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:zeplen
            ${{ env.IMAGE }}:${{ steps.ver.outputs.pin }}
          cache-from: type=gha,scope=zeplen
          cache-to: type=gha,mode=max,scope=zeplen
      - name: Summary
        run: echo "Pushed ${IMAGE}:${{ steps.ver.outputs.pin }}" >> "$GITHUB_STEP_SUMMARY"
